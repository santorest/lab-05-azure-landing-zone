version: 2
updates:
  - package-ecosystem: terraform
    directories: ["/bootstrap", "/landing-zone", "/modules/*"]
    schedule:
      interval: weekly
    # Provider majors (azurerm 5.x) change resource schemas: migrate deliberately, not through a bot PR.
    # Version ranges, not update-types: Dependabot applies update-types ignores to lock-file bumps but not to
    # the "update requirement" PRs it opens for modules without a lock file.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        versions: [">= 5.0"]
      - dependency-name: "hashicorp/azuread"
        versions: [">= 4.0"]
    groups:
      providers:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
