<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Lab 05: Azure secure landing zone (reference design)</title>
  <desc id="desc">Management groups with Azure Policy guardrails at the root; a hub-spoke network where every subnet has a default-deny NSG and storage and Key Vault are reached only through private endpoints; an optional Azure Firewall; Log Analytics with Microsoft Sentinel and five detections fed by diagnostic settings; Entra groups, report-only Conditional Access and PIM-eligible admin roles; and an offline CI pipeline that tests and scans the Terraform.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; }
      .gov { fill: #eef2ff; stroke: #6366f1; }
      .net { fill: #ecfeff; stroke: #0891b2; }
      .log { fill: #fff7ed; stroke: #ea580c; }
      .idn { fill: #f0fdf4; stroke: #16a34a; }
      .ci { fill: #f1f5f9; stroke: #475569; }
      .opt { fill: #ffffff; stroke: #94a3b8; stroke-dasharray: 6 4; }
      .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #0f172a; }
      .s { font-size: 11.5px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.3; fill: none; }
      .dash { stroke: #475569; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="24" y="34" class="h" style="font-size:20px">Azure secure landing zone — reference design (Terraform, never deployed)</text>

  <!-- Governance -->
  <rect x="20" y="52" width="300" height="420" rx="10" class="panel"/>
  <text x="36" y="78" class="h">Governance</text>
  <rect x="100" y="92" width="140" height="34" rx="6" class="box gov"/>
  <text x="170" y="114" class="t" text-anchor="middle">corp (root MG)</text>
  <path d="M170,126 V142 M70,142 H270 M70,142 V154 M170,142 V154 M270,142 V154" class="line"/>
  <rect x="30" y="154" width="84" height="30" rx="6" class="box gov"/><text x="72" y="174" class="s" text-anchor="middle">platform</text>
  <rect x="120" y="154" width="100" height="30" rx="6" class="box gov"/><text x="170" y="174" class="s" text-anchor="middle">landing-zones</text>
  <rect x="226" y="154" width="84" height="30" rx="6" class="box gov"/><text x="268" y="174" class="s" text-anchor="middle">sandbox</text>
  <text x="36" y="206" class="s">connectivity · management · identity</text>
  <text x="130" y="224" class="s">online (subscription) · internal</text>
  <rect x="30" y="240" width="280" height="140" rx="6" class="box"/>
  <text x="42" y="260" class="t" style="font-weight:600">Azure Policy at corp</text>
  <text x="42" y="280" class="s">• Allowed locations</text>
  <text x="42" y="298" class="s">• Require tags: owner, env, cost-center</text>
  <text x="42" y="316" class="s">• Deny public IP (custom)</text>
  <text x="42" y="334" class="s">• Key Vault diagnostics → workspace (DINE)</text>
  <text x="42" y="354" class="s">Firewall on → waiver for the</text>
  <text x="42" y="370" class="s">connectivity resource group only</text>
  <rect x="30" y="392" width="280" height="66" rx="6" class="box"/>
  <text x="42" y="412" class="t" style="font-weight:600">Budget alert</text>
  <text x="42" y="432" class="s">50 / 80 / 100 % of the monthly amount</text>
  <text x="42" y="449" class="s">State: bootstrap/ (Entra auth, IP-locked, lock)</text>

  <!-- Network -->
  <rect x="340" y="52" width="500" height="420" rx="10" class="panel"/>
  <text x="356" y="78" class="h">Network (hub-spoke)</text>
  <rect x="470" y="92" width="240" height="120" rx="8" class="box net"/>
  <text x="590" y="112" class="t" text-anchor="middle" style="font-weight:600">hub 10.0.0.0/22</text>
  <text x="484" y="134" class="s">snet-shared · NSG</text>
  <text x="484" y="152" class="s">GatewaySubnet</text>
  <text x="484" y="170" class="s">Private DNS: blob, vaultcore</text>
  <rect x="484" y="178" width="212" height="26" rx="5" class="opt"/>
  <text x="590" y="196" class="s" text-anchor="middle">Azure Firewall Basic (optional, off)</text>
  <path d="M530,212 V250" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M650,212 V250" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="536" y="236" class="s">peering</text><text x="656" y="236" class="s">peering</text>
  <rect x="360" y="250" width="220" height="90" rx="8" class="box net"/>
  <text x="470" y="270" class="t" text-anchor="middle" style="font-weight:600">online 10.1.0.0/22</text>
  <text x="374" y="292" class="s">snet-app · NSG</text>
  <text x="374" y="312" class="s">(internet-facing workloads)</text>
  <rect x="600" y="250" width="226" height="130" rx="8" class="box net"/>
  <text x="713" y="270" class="t" text-anchor="middle" style="font-weight:600">internal 10.2.0.0/22</text>
  <text x="614" y="292" class="s">snet-app · NSG</text>
  <text x="614" y="310" class="s">snet-private-endpoints · NSG</text>
  <rect x="610" y="320" width="104" height="48" rx="5" class="box"/>
  <text x="662" y="340" class="s" text-anchor="middle">PE → Storage</text>
  <text x="662" y="356" class="s" text-anchor="middle">(no public access)</text>
  <rect x="718" y="320" width="104" height="48" rx="5" class="box"/>
  <text x="770" y="340" class="s" text-anchor="middle">PE → Key Vault</text>
  <text x="770" y="356" class="s" text-anchor="middle">(no public access)</text>
  <rect x="360" y="392" width="466" height="66" rx="6" class="box"/>
  <text x="374" y="412" class="t" style="font-weight:600">Every NSG ends with deny-all inbound (4096)</text>
  <text x="374" y="432" class="s">Input validation refuses 22 / 3389 / 5985 / 5986 from Internet, *, 0.0.0.0/0, ::/0</text>
  <text x="374" y="449" class="s">(single ports, ranges and lists alike)</text>

  <!-- Logging -->
  <rect x="860" y="52" width="320" height="420" rx="10" class="panel"/>
  <text x="876" y="78" class="h">Logging &amp; detection</text>
  <rect x="880" y="92" width="280" height="62" rx="8" class="box log"/>
  <text x="1020" y="116" class="t" text-anchor="middle" style="font-weight:600">Log Analytics + Microsoft Sentinel</text>
  <text x="1020" y="136" class="s" text-anchor="middle">PerGB2018 · 90-day retention</text>
  <rect x="880" y="170" width="280" height="150" rx="6" class="box"/>
  <text x="892" y="190" class="t" style="font-weight:600">Diagnostic settings → workspace</text>
  <text x="892" y="210" class="s">• Subscription activity log</text>
  <text x="892" y="228" class="s">• Every NSG · workload blob service</text>
  <text x="892" y="246" class="s">• Key Vault</text>
  <text x="892" y="264" class="s">• Entra sign-in + audit logs (P1/P2)</text>
  <path d="M1020,170 V154" class="line" marker-end="url(#arrow)"/>
  <path d="M840,300 H880" class="dash" marker-end="url(#arrow)"/>
  <rect x="880" y="336" width="280" height="122" rx="6" class="box"/>
  <text x="892" y="356" class="t" style="font-weight:600">5 scheduled rules (rules.yaml + KQL)</text>
  <text x="892" y="376" class="s">• Privileged role assigned — T1098</text>
  <text x="892" y="394" class="s">• NSG opened to Internet — T1562</text>
  <text x="892" y="412" class="s">• Conditional Access changed — T1556</text>
  <text x="892" y="430" class="s">• Mass resource deletion — T1485</text>
  <text x="892" y="448" class="s">• Sign-in from unexpected country — T1078</text>

  <!-- Identity -->
  <rect x="20" y="490" width="820" height="120" rx="10" class="panel"/>
  <text x="36" y="516" class="h">Identity (Entra ID)</text>
  <rect x="36" y="528" width="240" height="70" rx="6" class="box idn"/>
  <text x="48" y="548" class="t" style="font-weight:600">Groups</text>
  <text x="48" y="566" class="s">platform-admins (role-assignable)</text>
  <text x="48" y="584" class="s">security-operations · workload-contributors</text>
  <rect x="290" y="528" width="270" height="70" rx="6" class="box idn"/>
  <text x="302" y="548" class="t" style="font-weight:600">Conditional Access — report-only</text>
  <text x="302" y="566" class="s">MFA for admins · MFA for all · block legacy</text>
  <text x="302" y="584" class="s">Enforce only with a break-glass exclusion</text>
  <rect x="574" y="528" width="250" height="70" rx="6" class="box idn"/>
  <text x="586" y="548" class="t" style="font-weight:600">PIM — eligible only</text>
  <text x="586" y="566" class="s">Owner, User Access Admin (subscription)</text>
  <text x="586" y="584" class="s">Global Admin (tenant) · Azure roles 365 days</text>
  <path d="M840,560 H1020 V458" class="dash" marker-end="url(#arrow)"/>
  <text x="850" y="552" class="s">sign-in / audit logs</text>

  <!-- CI -->
  <rect x="20" y="628" width="1160" height="116" rx="10" class="panel"/>
  <text x="36" y="654" class="h">CI — offline, no Azure credentials</text>
  <g class="s">
    <rect x="36" y="668" width="150" height="56" rx="6" class="box ci"/><text x="111" y="692" text-anchor="middle">fmt · validate</text><text x="111" y="710" text-anchor="middle">7 roots/modules</text>
    <rect x="200" y="668" width="200" height="56" rx="6" class="box ci"/><text x="300" y="692" text-anchor="middle">terraform test</text><text x="300" y="710" text-anchor="middle">mock providers, incl. negative tests</text>
    <rect x="414" y="668" width="130" height="56" rx="6" class="box ci"/><text x="479" y="692" text-anchor="middle">tflint</text><text x="479" y="710" text-anchor="middle">azurerm ruleset</text>
    <rect x="558" y="668" width="150" height="56" rx="6" class="box ci"/><text x="633" y="692" text-anchor="middle">Checkov</text><text x="633" y="710" text-anchor="middle">skips in EXCEPTIONS.md</text>
    <rect x="722" y="668" width="130" height="56" rx="6" class="box ci"/><text x="787" y="692" text-anchor="middle">Trivy config</text><text x="787" y="710" text-anchor="middle">High/Critical gate</text>
    <rect x="866" y="668" width="140" height="56" rx="6" class="box ci"/><text x="936" y="692" text-anchor="middle">No standing</text><text x="936" y="710" text-anchor="middle">privileged access</text>
    <rect x="1020" y="668" width="146" height="56" rx="6" class="box ci"/><text x="1093" y="692" text-anchor="middle">gitleaks</text><text x="1093" y="710" text-anchor="middle">full history</text>
  </g>
</svg>
